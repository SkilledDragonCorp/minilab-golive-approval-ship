name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DISABLE_TELEMETRY: "1"
  DO_NOT_TRACK: "1"
  npm_config_registry: https://registry.npmjs.org

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Skills frontmatter
        run: bun run check:skills

      - name: Unit tests (never deploys)
        run: bun test

      - name: Keyless report
        run: bun run report

      - name: Bun audit
        run: bun audit

      - name: No forbidden skill mirrors
        run: test ! -e .cursor/skills && test ! -e .agents/skills

  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm 9.12.2
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: "9.12.2"
          run_install: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Upstream validate cohort (verbatim)
        run: bash scripts/upstream-ci.sh

  upstream-runtime-node20:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Vendor golive-skill at pin
        run: bash scripts/fetch-upstream.sh

      - name: Setup Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"

      - name: Upstream runtime smoke (verbatim, Node 20)
        working-directory: vendor/golive-skill
        run: node ../../scripts/upstream-runtime-smoke.mjs

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Vendor golive-skill at pin (for osv-scanner lockfile)
        run: bash scripts/fetch-upstream.sh

      - name: Install pinned gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks_8.30.1_linux_x64.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          chmod +x gitleaks

      - name: Gitleaks
        run: ./gitleaks detect --source . --redact --verbose --no-banner --config .gitleaks.toml

      - name: Install pinned osv-scanner
        run: |
          OSV_VERSION=2.7.0
          OSV_SHA256=160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
          curl -sSL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" -o osv-scanner
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner

      - name: osv-scanner on upstream pnpm-lock.yaml
        run: ./osv-scanner scan --lockfile vendor/golive-skill/pnpm-lock.yaml

      - name: Setup Bun (skill checks)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Skills frontmatter
        run: bun run scripts/check-skills-frontmatter.ts

      - name: No forbidden skill mirrors
        run: test ! -e .cursor/skills && test ! -e .agents/skills
